# Raccolta dati post-giornata: scarica le ultime 3 stagioni di Serie C (Gironi A/B/C), Serie B e
# Serie D (Gironi A-I), aggiorna data/processed/*.csv (+ le quote pre-match in data/odds/footystats.csv)
# e committa solo se qualcosa è cambiato.
#
# Sorgente dati:
#   - FootyStats (API ufficiale, raggiungibile anche dai datacenter): serve la chiave API del tuo
#     account footystats.org, salvata come SEGRETO di repository FOOTYSTATS_API_KEY
#     (Settings → Secrets and variables → Actions → New repository secret). Sul sito aggiungi al tuo
#     account le leghe: Italy Serie C Group A / B / C, Italy Serie B e Italy Serie D Group A .. I
#     ("Choose leagues"): OGNI competizione da raccogliere deve essere fra le leghe scelte, perché l'API
#     rifiuta i dati di una lega non scelta ("League is not chosen by the user"). Una competizione la
#     cui lega non è scelta viene saltata con un avviso (riga `skipped DA: ...`, elencata nel riepilogo)
#     e le altre vengono raccolte e committate normalmente; i season id di config/competitions.toml
#     servono solo se /league-list non risponde. I piani FootyStats limitano il numero di leghe scelte:
#     se non puoi aggiungerle tutte, restringi l'input `competitions` (es. "A B C SB").
#     La chiave non compare mai nei log, nella cache né nei file committati.
#     Per default il job raccoglie TUTTE le 13 competizioni configurate (input `competitions` vuoto).
#     Serie D: la prima esecuzione inizializza le liste squadre dei 9 gironi in
#     config/teams_2026_27.json dall'endpoint league-teams (auto-init) e il commit le include.
#   - senza segreto si usa SofaScore (solo Serie C A/B/C). ATTENZIONE: SofaScore risponde spesso
#     HTTP 403 agli IP dei datacenter; in quel caso il job fallisce e il riepilogo lo spiega.
#
# Dove gira:
#   - per default sui runner GitHub (ubuntu-latest), sufficiente con FootyStats.
#   - per girare dal tuo PC (IP residenziale, necessario per SofaScore): registra un self-hosted runner
#     (Settings → Actions → Runners → New self-hosted runner) e imposta la variabile di repository
#     HARVEST_RUNNER = self-hosted (Settings → Secrets and variables → Actions → Variables).
#     Il job partirà sul PC quando è acceso e il runner è in esecuzione.
name: Aggiorna dati Serie C, Serie B e Serie D

on:
  schedule:
    # Lunedì e giovedì alle 06:30 UTC (dopo i turni del weekend e infrasettimanali).
    - cron: "30 6 * * 1,4"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Numero di stagioni da raccogliere (le più recenti)"
        default: "3"
        required: false
      competitions:
        description: "Competizioni FootyStats (codici separati da spazio, es. A B C SB DA DB DC DD DE DF DG DH DI); vuoto = tutte le 13 configurate"
        default: ""
        required: false
      with_stats:
        description: "SofaScore: scaricare anche tiri/angoli/xG (true/false)"
        default: "true"
        required: false

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ${{ vars.HARVEST_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      # Vuoto quando il segreto non è configurato: in quel caso parte il passo SofaScore.
      FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
      SERIEC_LOG_LEVEL: INFO
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Cache risposte grezze (stagioni concluse)
        uses: actions/cache@v4
        with:
          path: data/raw
          key: harvest-raw-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            harvest-raw-${{ github.ref_name }}-
            sofascore-raw-${{ github.ref_name }}-

      - name: Raccolta dati (FootyStats)
        if: env.FOOTYSTATS_API_KEY != ''
        run: |
          set -o pipefail
          SEASONS="${{ github.event.inputs.seasons || '3' }}"
          COMPETITIONS="${{ github.event.inputs.competitions }}"
          # Nessun --competitions = tutte le competizioni di config/competitions.toml (Serie C A/B/C, Serie B, Serie D A-I);
          # i gironi di Serie D ancora senza squadre in config/teams_2026_27.json vengono inizializzati da league-teams.
          COMPETITIONS_FLAG=""
          if [ -n "$COMPETITIONS" ]; then COMPETITIONS_FLAG="--competitions $COMPETITIONS"; fi
          echo "Sorgente: FootyStats (competizioni: ${COMPETITIONS:-tutte le configurate}, stagioni: $SEASONS)" | tee harvest.log
          # shellcheck disable=SC2086
          python -m src.ingestion.footystats $COMPETITIONS_FLAG --seasons "$SEASONS" \
            --odds-out data/odds/footystats.csv 2>&1 | tee -a harvest.log

      - name: Raccolta dati (SofaScore, nessun segreto FOOTYSTATS_API_KEY)
        if: env.FOOTYSTATS_API_KEY == ''
        run: |
          set -o pipefail
          SEASONS="${{ github.event.inputs.seasons || '3' }}"
          STATS_FLAG=""
          if [ "${{ github.event.inputs.with_stats || 'true' }}" = "false" ]; then STATS_FLAG="--no-stats"; fi
          echo "Sorgente: SofaScore (nessun segreto FOOTYSTATS_API_KEY configurato; solo Serie C A/B/C)" | tee harvest.log
          python -m src.ingestion.harvester --gironi A B C --seasons "$SEASONS" $STATS_FLAG 2>&1 | tee -a harvest.log

      - name: Riepilogo (partite per competizione e stagione)
        if: success()
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          import pandas as pd
          from src.common.schemas import season_of

          lines = ["## Dati raccolti", ""]
          log_text = Path("harvest.log").read_text(encoding="utf-8") if Path("harvest.log").exists() else ""
          source = log_text.splitlines()[0] if log_text else ""
          if source:
              lines += [source, ""]
          # auto-init della Serie D: la CLI stampa "registry initialised: DA (18 teams), ... -> config/teams_2026_27.json"
          initialised = re.search(r"^registry initialised: (.+)$", log_text, flags=re.MULTILINE)
          if initialised:
              lines += [f"Gironi inizializzati in config/teams_2026_27.json (Serie D, liste squadre da FootyStats): {initialised.group(1)}", ""]
          # competizioni saltate: la CLI stampa "skipped DA: 'Italy Serie D Group A' is not among the account's chosen leagues: ..."
          skipped = re.findall(r"^skipped (\S+): (.+)$", log_text, flags=re.MULTILINE)
          if skipped:
              lines.append(f"**Competizioni saltate ({len(skipped)})**, non raccolte perché la lega non è scelta nell'account FootyStats "
                           "(o non è supportata): aggiungile su footystats.org (Choose leagues) oppure restringi l'input `competitions`.")
              lines += [f"- `{code}`: {reason}" for code, reason in skipped]
              lines.append("")
          matches = Path("data/processed/matches.csv")
          if matches.exists():
              df = pd.read_csv(matches, parse_dates=["date"])
              df["season"] = df["date"].map(season_of)
              table = df.pivot_table(index="girone", columns="season", values="match_id", aggfunc="count", fill_value=0)
              table = table[sorted(table.columns, reverse=True)]
              lines.append(f"**{len(df)} partite** in `data/processed/matches.csv`")
              lines.append("")
              lines.append("| competizione | " + " | ".join(table.columns) + " | totale |")
              lines.append("|---|" + "---|" * (len(table.columns) + 1))
              for code, row in table.iterrows():
                  lines.append(f"| {code} | " + " | ".join(str(int(v)) for v in row) + f" | {int(row.sum())} |")
          fixtures = Path("data/processed/fixtures.csv")
          if fixtures.exists():
              fx = pd.read_csv(fixtures)
              per = ", ".join(f"{g}: {n}" for g, n in fx["girone"].value_counts().sort_index().items())
              lines += ["", f"Prossime partite: {len(fx)} ({per})"]
          odds = Path("data/odds/footystats.csv")
          if odds.exists():
              od = pd.read_csv(odds)
              lines.append(f"Quote pre-match FootyStats: {len(od)} righe per {od['match_id'].nunique()} partite")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8").write("\n".join(lines) + "\n")
          PY

      - name: Riepilogo in caso di errore
        if: failure()
        run: |
          {
            echo "## Raccolta dati non riuscita"
            if grep -qiE "API key (not configured|missing)|footystats: FootyStats API key" harvest.log; then
              echo "Manca la chiave FootyStats: aggiungi il segreto di repository **FOOTYSTATS_API_KEY** (Settings → Secrets and variables → Actions)."
            elif grep -qE "status=429|HTTP 429" harvest.log; then
              echo "FootyStats ha risposto **429**: superato il limite orario di richieste (~1800/h). Il job riproverà alla prossima esecuzione."
            elif grep -qE "status=403|HTTP 403|Forbidden" harvest.log; then
              echo "SofaScore ha risposto **403 Forbidden**: l'IP del runner è bloccato."
              echo "Soluzione: configura il segreto FOOTYSTATS_API_KEY (API ufficiale), oppure esegui il job da un self-hosted runner sul tuo PC (variabile HARVEST_RUNNER=self-hosted) o lancia \`avvia.command\` / \`avvia.bat\` in locale."
            elif grep -qiE "not chosen by the user|API refused the request|footystats failed: competitions not among the account's chosen leagues" harvest.log; then
              # il testo dell'errore vero (rifiuto dell'API), non l'avviso "skipped" che compare anche nelle esecuzioni riuscite
              echo "FootyStats ha rifiutato una competizione perché la sua lega non è fra quelle scelte nel tuo account: su footystats.org aggiungi *Italy Serie C Group A/B/C*, *Italy Serie B* e *Italy Serie D Group A..I* (Choose leagues), oppure restringi l'input \`competitions\` alle leghe che hai."
            elif grep -q "no matches harvested" harvest.log && grep -q "^skipped " harvest.log; then
              echo "Nessuna partita raccolta: tutte le competizioni richieste sono state saltate (righe \`skipped\`: leghe non scelte nell'account FootyStats). Aggiungile su footystats.org (Choose leagues) oppure restringi l'input \`competitions\`."
            else
              echo "Vedi il log del passo *Raccolta dati*."
            fi
            echo; echo '```'; tail -n 40 harvest.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit dei CSV aggiornati
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/matches.csv data/processed/fixtures.csv
          [ -f data/odds/footystats.csv ] && git add data/odds/footystats.csv
          # Dizionari squadre: l'auto-init della Serie D e la mappa id FootyStats -> nome canonico li modificano.
          [ -f config/footystats_teams.json ] && git add config/footystats_teams.json
          [ -f config/teams_2026_27.json ] && git add config/teams_2026_27.json
          if git diff --cached --quiet; then
            echo "Nessuna variazione nei dati: niente da committare." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          N=$(python - <<'PY'
          import pandas as pd; print(len(pd.read_csv("data/processed/matches.csv")))
          PY
          )
          REGISTRY_NOTE=""
          if ! git diff --cached --quiet -- config/teams_2026_27.json; then
            REGISTRY_NOTE=" + dizionario squadre"
          fi
          git commit -m "Aggiorna dati Serie C / Serie B / Serie D ($(date -u +%Y-%m-%d), $N partite$REGISTRY_NOTE)"
          git push
          echo "Dati aggiornati: $N partite in data/processed/matches.csv$REGISTRY_NOTE" >> "$GITHUB_STEP_SUMMARY"
