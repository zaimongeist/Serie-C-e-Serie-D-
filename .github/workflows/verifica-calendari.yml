# Verifica dei calendari FootyStats (squadre, giornate, date, partite rinviate, differenze
# con il dizionario squadre). Usa il secret FOOTYSTATS_API_KEY e NON scrive dati nel repository:
# il riepilogo compare nella pagina del run e i file restano come artifact per 1 giorno.
# Parte da solo quando cambia lo script di verifica sul branch di lavoro, oppure a mano.
name: Verifica calendari FootyStats

on:
  push:
    branches: [ccr-407332d7-pt18ov]
    paths:
      - .github/workflows/verifica-calendari.yml
      - src/ingestion/calendar_snapshot.py
      - config/competitions.toml
      - config/teams_2026_27.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifica-calendari
  cancel-in-progress: true

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verifica calendari
        env:
          FOOTYSTATS_API_KEY: ${{ secrets.FOOTYSTATS_API_KEY }}
        run: |
          if [ -z "${FOOTYSTATS_API_KEY}" ]; then
            echo "## Secret FOOTYSTATS_API_KEY mancante" >> "$GITHUB_STEP_SUMMARY"
            echo "Crealo in Settings -> Secrets and variables -> Actions." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          set +e
          python -m src.ingestion.calendar_snapshot --out snapshot/calendario.json --summary snapshot/riepilogo.md --log-level WARNING
          status=$?
          set -e
          if [ -f snapshot/riepilogo.md ]; then cat snapshot/riepilogo.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $status

      - name: Conserva il risultato (1 giorno)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifica-calendari
          path: snapshot/
          retention-days: 1
          if-no-files-found: ignore
