# Competitions of the perimeter, one [[competition]] table each, in DISPLAY ORDER.
#
# This file is the single source of truth for "which leagues exist": the Girone
# enum (src/common/schemas.py) is built from it at import time, the team registry
# (config/teams_<season>.json) uses the codes as keys, the engine fits one home
# advantage and one sum(alpha) = 0 constraint group per code, the simulator, the
# console and the dashboard iterate it instead of hard-coding A/B/C.
#
# To add a league: append a [[competition]] table here, add its teams under the
# same code in config/teams_<season>.json (or leave the key empty and let the
# FootyStats harvester fill it from /league-teams) and add the FootyStats league
# to your footystats.org account (the `footystats_name` is the `name` field
# returned by /league-list). Codes are short upper-case identifiers (letters and
# digits) and must be unique; `family` groups the gironi of one league ("Serie C"
# has three codes, "Serie B" one, "Serie D" nine), `tier` is the level in the
# Italian pyramid (2 = Serie B, 3 = Serie C, 4 = Serie D) and is informational only.
#
# `sofascore_tournament_id` is the undocumented SofaScore unique-tournament id
# used by the legacy harvester (see config/endpoints.toml); 0 means unknown and
# the competition is then not served by that provider (Serie D). FootyStats
# resolves its own season ids from /league-list; the optional
# [competition.season_ids] sub-table (season label -> FootyStats season id,
# verified live on 2026-11-06) is the fallback used when /league-list cannot be
# reached or the league is not among the account's chosen leagues.
#
# Serie D (tier 4) has nine gironi of 18 teams (34 rounds), codes DA..DI, family
# "Serie D". Their team lists are NOT known offline: the FootyStats harvester
# initialises them in config/teams_<season>.json from /league-teams the first
# time it runs with a key covering Serie D (auto-init), for future seasons too.

[[competition]]
code = "A"
label = "Serie C Girone A"
short = "Girone A"
country = "Italy"
footystats_name = "Italy Serie C Group A"
sofascore_tournament_id = 141
tier = 3
family = "Serie C"
[competition.season_ids]
"2024/25" = 12659
"2025/26" = 15535
"2026/27" = 17487

