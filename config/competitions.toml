# Competitions of the perimeter, one [[competition]] table each, in DISPLAY ORDER.
#
# This file is the single source of truth for "which leagues exist": the Girone
# enum (src/common/schemas.py) is built from its ENABLED tables at import time,
# the team registry (config/teams_<season>.json) uses the codes as keys, the
# engine fits one home advantage and one sum(alpha) = 0 constraint group per code,
# the simulator, the console and the dashboard iterate it instead of hard-coding
# A/B/C.
#
# Keys of a [[competition]] table:
#   code                     short upper-case identifier (letters and digits, unique)
#   label / short            full and compact public names ("Serie C Girone A" / "Girone A")
#   country                  country of the league; it is also the FIT GROUP (see below)
#   footystats_name          the `name` field returned by FootyStats /league-list
#   sofascore_tournament_id  legacy SofaScore id, 0 = unknown (not served by that provider)
#   tier                     level in the national pyramid (1 = top flight), informational only
#   family                   the league the table belongs to ("Serie C" has three gironi,
#                            "Serie B" one, "Serie D" nine, every foreign league one)
#   enabled                  optional, default true; false = configured but switched off
#   section                  optional, default = family; the dashboard section that shows it
#   [competition.season_ids] optional fallback FootyStats season ids (see below)
#
# Sections: every section is its own dashboard page, in the order of first
# appearance in this file ("Serie C", "Serie B", "Serie D" with the shipped
# file). By default a section is a family; several families can share one
# section by giving them the same `section` value.
#
# Fit groups: competitions of the same `country` are fitted JOINTLY by one
# Dixon-Coles model (promotions and relegations connect Serie A, B, C and D
# through the clubs that move between them), competitions of different
# countries are fitted SEPARATELY (no match connects them), see
# src/engine/fitgroups.py. Enabling Serie A adds it to the "Italy" group;
# enabling the Premier League creates a second group, "England".
#
# Disabled competitions (enabled = false) are configured but invisible to the
# rest of the code: they are not members of the Girone enum, are not harvested
# (src/ingestion/footystats.py DEFAULT_COMPETITIONS), have no section and no
# fit group, and their key in config/teams_<season>.json, if any, is skipped
# with a log line. The shipped file carries Serie A and six European top
# flights ready to switch on.
#
# To ENABLE a league:
#   1. set `enabled = true` on its table below;
#   2. add the league to your footystats.org account ("Choose leagues": the API
#      refuses the data of a league that is not chosen, see below; the plans
#      limit the number of chosen leagues);
#   3. run the data refresh (dashboard sidebar or the harvester CLI): the
#      FootyStats registry sync fills its teams in config/teams_<season>.json
#      from /league-teams, then its matches, fixtures and odds are harvested.
# Switching it off again is `enabled = false` (reversible: the registry key is
# kept and skipped). To ADD a league that is not listed: append a table with
# the keys above (and `enabled = true`), then follow steps 2 and 3.
#
# `sofascore_tournament_id` is the undocumented SofaScore unique-tournament id
# used by the legacy harvester (see config/endpoints.toml); 0 means unknown and
# the competition is then not served by that provider (Serie D, the leagues
# added for FootyStats). FootyStats resolves its own season ids from
# /league-list; the optional [competition.season_ids] sub-table (season label ->
# FootyStats season id; the Italian Serie B/C/D ids verified live on 2026-11-06,
# the ids of the disabled leagues as published by /league-list for 2024/25,
# 2025/26 and 2026/27) is a fallback that the FootyStats harvester uses
# only when /league-list itself cannot be reached. It cannot stand in for a
# league the account has not chosen:
# the API refuses the data of such a league ("League is not chosen by the user"),
# so every competition to harvest must be among the account's chosen leagues and
# a competition whose league is not chosen is skipped by the harvester with a
# warning (the others are harvested as usual).
#
# Serie D (tier 4) has nine gironi of 18 teams (34 rounds), codes DA..DI, family
# "Serie D". Their team lists are NOT known offline: the FootyStats harvester
# initialises them in config/teams_<season>.json from /league-teams the first
# time it runs with a key covering Serie D (auto-init), for future seasons too.

# Serie A: disabled until the league is chosen in the FootyStats account. Listed first so that,
# once enabled, it is the first section of the dashboard; it joins the "Italy" fit group.

[[competition]]
code = "SA"
label = "Serie A"
short = "Serie A"
country = "Italy"
footystats_name = "Italy Serie A"
sofascore_tournament_id = 0
tier = 1
family = "Serie A"
enabled = false
section = "Serie A"
[competition.season_ids]
"2024/25" = 12530
"2025/26" = 15068
"2026/27" = 17084

