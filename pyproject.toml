[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "seriec-quant-lab"
version = "0.1.0"
description = "Dixon-Coles quantitative engine and +EV detector for Italian Serie C (Gironi A/B/C)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "httpx>=0.27",
    "thefuzz>=0.22",
    "rapidfuzz>=3.9",
    "streamlit>=1.38",
    "plotly>=5.22",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"
